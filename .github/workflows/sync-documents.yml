name: Sincronizar documentos da FACOM e do IME

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-documents
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  sync:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - run: npm run sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FACOM_IP: ${{ secrets.FACOM_IP }}
          IME_IP: ${{ secrets.IME_IP }}

      - name: Restaurar o estado do pacote OKF
        id: okf-state
        uses: actions/cache/restore@v4
        with:
          path: conhecimento/.estado.json
          key: okf-estado-${{ github.run_id }}
          restore-keys: okf-estado-
      - name: Recuperar o estado do histórico do git
        if: steps.okf-state.outputs.cache-matched-key == ''
        run: |
          c=$(git log -1 --format=%H -- conhecimento/.estado.json)
          if [ -n "$c" ]; then git show "$c^:conhecimento/.estado.json" > conhecimento/.estado.json || rm -f conhecimento/.estado.json; fi
      - name: Atualizar o pacote OKF
        id: okf
        if: always()
        run: npm run okf
        env:
          FACOM_IP: ${{ secrets.FACOM_IP }}
          IME_IP: ${{ secrets.IME_IP }}
      - name: Guardar o estado do pacote OKF
        if: always() && hashFiles('conhecimento/.estado.json') != ''
        uses: actions/cache/save@v4
        with:
          path: conhecimento/.estado.json
          key: okf-estado-${{ github.run_id }}
      - name: Publicar o pacote OKF no repositório
        if: always() && steps.okf.outcome != 'skipped'
        run: |
          git add -A conhecimento
          if git diff --cached --quiet; then echo "pacote OKF sem mudanças"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Atualiza o pacote OKF das páginas dos sites"
          git pull -q --rebase origin main
          git push -q origin HEAD:main
      - name: Importar o pacote OKF para o banco
        if: always()
        run: npm run okf:import -- --max-trechos=300
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - run: npm run dedupe
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - run: npm run graph
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      - run: npm run graph -- --references
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - run: npm run teaching
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

name: Sincronizar documentos da FACOM

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - run: npm run sync:facom
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FACOM_IP: ${{ secrets.FACOM_IP }}
      - run: npm run dedupe
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

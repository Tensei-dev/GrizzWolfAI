name: Sincronizar documentos da FACOM

on:
  schedule:
    - cron: '0 9 * * *' # todo dia às 06h de Brasília
  workflow_dispatch: # permite rodar na mão pela aba Actions

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - run: npm run sync:facom
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - run: npm run dedupe
        if: always() # roda mesmo se algum documento falhou na sincronização
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
